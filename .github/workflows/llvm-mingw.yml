name: LLVM-MinGW toolchain

# Builds the LLVM-MinGW toolchain (Clang, lld and the MinGW-w64 runtimes for
# i686, x86_64, armv7, aarch64 and arm64ec, plus the PowerPC backend) from
# the LLVM fork and build recipe pinned in scripts/versions.env, and uploads
# it to the llvm-mingw-<version> release that rosbe-unix-bootstrap.sh,
# setup.ps1, scripts/package.sh and scripts/build-llvm-mingw-riscv.sh
# download from.
#
# Archives already on that release are skipped unless `overwrite` is set, so
# a rerun only fills in what is missing.

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: 'Rebuild and replace archives that are already published'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      triplet: ${{ steps.plan.outputs.triplet }}
      llvm_repository: ${{ steps.plan.outputs.llvm_repository }}
      llvm_commit: ${{ steps.plan.outputs.llvm_commit }}
      llvm_targets: ${{ steps.plan.outputs.llvm_targets }}
      recipe_repo: ${{ steps.plan.outputs.recipe_repo }}
      recipe_commit: ${{ steps.plan.outputs.recipe_commit }}
      linux: ${{ steps.plan.outputs.linux }}
      linux_x86_64: ${{ steps.plan.outputs.linux_x86_64 }}
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@v4

      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          # shellcheck source=scripts/versions.env
          source scripts/versions.env
          TAG="llvm-mingw-${LLVM_VERSION}"
          PUBLISHED="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)"

          # needed <asset suffix>: is this archive still to be built?
          needed() {
            local asset="llvm-mingw-${LLVM_VERSION}-${LLVM_TRIPLET}-$1"
            if [ "$OVERWRITE" != "true" ] && grep -Fxq "$asset" <<<"$PUBLISHED"; then
              echo "Already published: $asset" >&2
              echo false
            else
              echo "To build: $asset" >&2
              echo true
            fi
          }

          LINUX='[]'
          LINUX_X86_64="$(needed ubuntu-22.04-x86_64.tar.xz)"
          if [ "$LINUX_X86_64" = true ]; then
            LINUX="$(jq -c '. + [{arch: "x86_64", runner: "ubuntu-22.04"}]' <<<"$LINUX")"
          fi
          if [ "$(needed ubuntu-22.04-aarch64.tar.xz)" = true ]; then
            LINUX="$(jq -c '. + [{arch: "aarch64", runner: "ubuntu-22.04-arm"}]' <<<"$LINUX")"
          fi

          {
            echo "tag=$TAG"
            echo "version=$LLVM_VERSION"
            echo "triplet=$LLVM_TRIPLET"
            echo "llvm_repository=https://github.com/${LLVM_REPO}.git"
            echo "llvm_commit=$LLVM_COMMIT"
            echo "llvm_targets=${LLVM_TARGETS//,/;}"
            echo "recipe_repo=$LLVM_MINGW_RECIPE_REPO"
            echo "recipe_commit=$LLVM_MINGW_RECIPE_COMMIT"
            echo "linux=$LINUX"
            echo "linux_x86_64=$LINUX_X86_64"
            echo "macos=$(needed macos-universal.tar.xz)"
            echo "windows=$(needed x86_64.zip)"
          } >> "$GITHUB_OUTPUT"

  # Cross compilers hosted on Linux. Built on Ubuntu 22.04 so the archives
  # only need glibc 2.35.
  linux:
    needs: plan
    if: needs.plan.outputs.linux != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.linux) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      LLVM_REPOSITORY: ${{ needs.plan.outputs.llvm_repository }}
      LLVM_VERSION: ${{ needs.plan.outputs.llvm_commit }}
      LLVM_TARGETS_TO_BUILD: ${{ needs.plan.outputs.llvm_targets }}
      # No dynamic dependency that would tie the binaries to one distro.
      LLVM_CMAKEFLAGS: -DLLVM_ENABLE_LIBXML2=OFF
      NAME: llvm-mingw-${{ needs.plan.outputs.version }}-${{ needs.plan.outputs.triplet }}-ubuntu-22.04-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.plan.outputs.recipe_repo }}
          ref: ${{ needs.plan.outputs.recipe_commit }}

      - name: Build
        run: |
          ./build-all.sh "$PWD/install/llvm-mingw" --disable-lldb --disable-clang-tools-extra

      - name: Test
        run: |
          ./run-tests.sh "$PWD/install/llvm-mingw"
          # The PowerPC backend has no MinGW runtime; check that it is there.
          echo 'int f(int a) { return a + 1; }' > ppc.c
          install/llvm-mingw/bin/clang --target=powerpcle-pc-windows-msvc -c ppc.c -o ppc.obj
          install/llvm-mingw/bin/llvm-readobj --file-headers ppc.obj | grep -i 'IMAGE_FILE_MACHINE_POWERPC'

      - name: Package
        run: |
          mkdir -p out
          mv install/llvm-mingw "install/$NAME"
          tar -Jcf "out/$NAME.tar.xz" --format=ustar --numeric-owner --owner=0 --group=0 --sort=name -C install "$NAME"
          ( cd out && sha256sum "$NAME.tar.xz" > "$NAME.tar.xz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: llvm-mingw-ubuntu-22.04-${{ matrix.arch }}
          path: out/llvm-mingw-*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  # Universal (arm64 + x86_64) cross compiler hosted on macOS.
  macos:
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-14
    timeout-minutes: 350
    env:
      LLVM_REPOSITORY: ${{ needs.plan.outputs.llvm_repository }}
      LLVM_VERSION: ${{ needs.plan.outputs.llvm_commit }}
      LLVM_TARGETS_TO_BUILD: ${{ needs.plan.outputs.llvm_targets }}
      # Homebrew's zstd only exists for the runner's own architecture.
      LLVM_CMAKEFLAGS: -DLLVM_ENABLE_ZSTD=OFF
      MACOS_REDIST: 1
      NAME: llvm-mingw-${{ needs.plan.outputs.version }}-${{ needs.plan.outputs.triplet }}-macos-universal
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.plan.outputs.recipe_repo }}
          ref: ${{ needs.plan.outputs.recipe_commit }}

      - name: Build
        run: |
          ./build-all.sh "$PWD/install/llvm-mingw" --disable-lldb --disable-clang-tools-extra

      - name: Test
        run: |
          ./run-tests.sh "$PWD/install/llvm-mingw"

      - name: Package
        run: |
          mkdir -p out
          mv install/llvm-mingw "install/$NAME"
          gtar -Jcf "out/$NAME.tar.xz" --format=ustar --numeric-owner --owner=0 --group=0 --sort=name -C install "$NAME"
          ( cd out && shasum -a 256 "$NAME.tar.xz" > "$NAME.tar.xz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: llvm-mingw-macos-universal
          path: out/llvm-mingw-*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  # Toolchain hosted on Windows x86_64, cross-compiled with the Linux one,
  # whose runtimes it reuses.
  windows:
    needs: [plan, linux]
    if: ${{ !cancelled() && needs.plan.outputs.windows == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
      LLVM_REPOSITORY: ${{ needs.plan.outputs.llvm_repository }}
      LLVM_VERSION: ${{ needs.plan.outputs.llvm_commit }}
      LLVM_TARGETS_TO_BUILD: ${{ needs.plan.outputs.llvm_targets }}
      LINUX_NAME: llvm-mingw-${{ needs.plan.outputs.version }}-${{ needs.plan.outputs.triplet }}-ubuntu-22.04-x86_64
      NAME: llvm-mingw-${{ needs.plan.outputs.version }}-${{ needs.plan.outputs.triplet }}-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.plan.outputs.recipe_repo }}
          ref: ${{ needs.plan.outputs.recipe_commit }}

      - name: Linux toolchain from this run
        if: needs.plan.outputs.linux_x86_64 == 'true'
        uses: actions/download-artifact@v4
        with:
          name: llvm-mingw-ubuntu-22.04-x86_64
          path: native

      - name: Linux toolchain from the release
        if: needs.plan.outputs.linux_x86_64 != 'true'
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir native \
            --pattern "$LINUX_NAME.tar.xz" --pattern "$LINUX_NAME.tar.xz.sha256"

      - name: Unpack the Linux toolchain
        run: |
          ( cd native && sha256sum --check --strict "$LINUX_NAME.tar.xz.sha256" )
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -Jxf "native/$LINUX_NAME.tar.xz" -C /opt/llvm-mingw --strip-components=1
          rm -rf native

      - name: Build
        run: |
          ./build-cross-tools.sh /opt/llvm-mingw "$PWD/install/llvm-mingw" x86_64 \
            --disable-lldb --disable-clang-tools-extra

      - name: Package
        run: |
          mkdir -p out
          mv install/llvm-mingw "install/$NAME"
          ( cd install && zip -9rqX "../out/$NAME.zip" "$NAME" )
          ( cd out && sha256sum "$NAME.zip" > "$NAME.zip.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: llvm-mingw-windows-x86_64
          path: out/llvm-mingw-*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  # The Windows toolchain never ran on the machine that built it: install it
  # the way setup.ps1 does and build something with it for real.
  smoke-windows:
    needs: [plan, windows]
    if: ${{ !cancelled() && needs.plan.outputs.windows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: llvm-mingw-windows-x86_64
          path: dist

      - name: Verify checksum and extract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sum = Get-Item dist/llvm-mingw-*-x86_64.zip.sha256
          $expected, $name = (Get-Content $sum.FullName -TotalCount 1) -split '\s+', 2
          $name = $name.TrimStart('*')
          if ($name -ne $sum.BaseName) { throw "Checksum file names '$name', expected '$($sum.BaseName)'" }
          $zip = Join-Path $sum.DirectoryName $name
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA256 mismatch for ${name}: $actual" }

          $dest = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Expand-Archive -Path $zip -DestinationPath $dest
          "TOOLCHAIN_DIR=$(Join-Path $dest ($name -replace '\.zip$', ''))" >> $env:GITHUB_ENV

      - name: Compile, link and run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:TOOLCHAIN_DIR 'bin'
          # Nothing but the toolchain and the system directory on PATH.
          $env:PATH = "$bin;$env:SystemRoot\System32"
          function Run($exe) {
            & $exe @args
            if ($LASTEXITCODE -ne 0) { throw "$exe exited with $LASTEXITCODE" }
          }

          Run clang --version
          Set-Content hello.cpp '#include <iostream>', 'int main() { std::cout << "hello" << std::endl; return 0; }'
          Run x86_64-w64-mingw32-clang++ hello.cpp -o hello.exe
          Run .\hello.exe
          foreach ($triple in 'i686-w64-mingw32', 'aarch64-w64-mingw32', 'armv7-w64-mingw32') {
            Run "$triple-clang++" hello.cpp -o "hello-$triple.exe"
          }
          Set-Content ppc.c 'int f(int a) { return a + 1; }'
          Run clang --target=powerpcle-pc-windows-msvc -c ppc.c -o ppc.obj

  publish:
    needs: [plan, linux, macos, windows, smoke-windows]
    # Publish the hosts that built even if another one failed.
    if: ${{ !cancelled() && (needs.linux.result == 'success' || needs.macos.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      LLVM_COMMIT: ${{ needs.plan.outputs.llvm_commit }}
      LLVM_REPOSITORY: ${{ needs.plan.outputs.llvm_repository }}
      WINDOWS_SMOKE: ${{ needs.smoke-windows.result }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: llvm-mingw-*
          path: dist
          merge-multiple: true

      - name: Upload to the toolchain release
        run: |
          shopt -s nullglob
          cd dist

          # An archive from this or an earlier attempt of the run is only
          # good if the Windows smoke test of this attempt passed.
          if [[ "$WINDOWS_SMOKE" != "success" ]]; then
            for f in llvm-mingw-*.zip llvm-mingw-*.zip.sha256; do
              echo "::warning::Not publishing $f: Windows smoke test result is '$WINDOWS_SMOKE'."
              rm -f "$f"
            done
          fi

          sums=( llvm-mingw-*.sha256 )
          if [[ ${#sums[@]} -eq 0 ]]; then
            echo "No toolchain archives were built."
            exit 1
          fi
          sha256sum --check --strict "${sums[@]}"

          files=( llvm-mingw-* )

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --prerelease --latest=false \
              --title "LLVM-MinGW $VERSION" \
              --notes "LLVM-MinGW toolchain archives built from ${LLVM_REPOSITORY%.git} at $LLVM_COMMIT, installed by RosBE as llvm-mingw."
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

name: Toolchains

# Builds the two LLVM toolchains pinned in scripts/versions.env, both from the
# same LLVM fork, and uploads them to the releases that
# rosbe-unix-bootstrap.sh, setup.ps1 and scripts/package.sh download from:
#
#   llvm-mingw-<version>          Clang, lld and the MinGW-w64 runtimes for
#                                 i686, x86_64, armv7, aarch64 and arm64ec,
#                                 plus the PowerPC backend (mingw-* jobs).
#   llvm-<version>                Clang and lld for every LiberNT target, with
#                                 the LLVM runtime sources the LiberNT build
#                                 compiles its C++ runtimes from.
#
# Archives already on those releases are skipped unless `overwrite` is set, so
# a rerun only fills in what is missing.
#
# The Windows archives are cross-compiled on Linux, so they are only
# published after a smoke test passed on a Windows runner.

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: 'Rebuild and replace archives that are already published'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
      windows: ${{ steps.plan.outputs.windows }}
      mingw_tag: ${{ steps.mingw.outputs.tag }}
      mingw_version: ${{ steps.mingw.outputs.version }}
      mingw_triplet: ${{ steps.mingw.outputs.triplet }}
      mingw_llvm_repository: ${{ steps.mingw.outputs.llvm_repository }}
      mingw_llvm_commit: ${{ steps.mingw.outputs.llvm_commit }}
      mingw_llvm_targets: ${{ steps.mingw.outputs.llvm_targets }}
      mingw_recipe_repo: ${{ steps.mingw.outputs.recipe_repo }}
      mingw_recipe_commit: ${{ steps.mingw.outputs.recipe_commit }}
      mingw_linux: ${{ steps.mingw.outputs.linux }}
      mingw_linux_x86_64: ${{ steps.mingw.outputs.linux_x86_64 }}
      mingw_macos: ${{ steps.mingw.outputs.macos }}
      mingw_windows: ${{ steps.mingw.outputs.windows }}
    steps:
      - uses: actions/checkout@v4

      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          # shellcheck source=scripts/versions.env
          source scripts/versions.env
          TAG="llvm-${LLVM_NATIVE_VERSION}"
          PUBLISHED="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)"
          MATRIX='[]'
          WINDOWS=false

          # add <platform> <archive extension> [<runner> <container>]
          add() {
            local asset="llvm-${LLVM_NATIVE_VERSION}-$1.$2"
            if [ "$OVERWRITE" != "true" ] && grep -Fxq "$asset" <<<"$PUBLISHED"; then
              echo "Already published: $asset"
              return 0
            fi
            echo "To build: $asset"
            # Built by build-windows, after the LLVM-MinGW it is compiled with.
            if [ "$1" = windows-x86_64 ]; then WINDOWS=true; return 0; fi
            MATRIX="$(jq -c --arg p "$1" --arg r "$3" --arg c "$4" \
              '. + [{platform: $p, runner: $r, container: $c}]' <<<"$MATRIX")"
          }

          # Linux archives are built in ubuntu:22.04 so they only need glibc 2.35.
          add ubuntu-22.04-x86_64  tar.xz ubuntu-latest    ubuntu:22.04
          add ubuntu-22.04-aarch64 tar.xz ubuntu-24.04-arm ubuntu:22.04
          add macos-universal      tar.xz macos-14         ''
          add windows-x86_64       zip

          {
            echo "tag=$TAG"
            echo "matrix=$MATRIX"
            echo "windows=$WINDOWS"
          } >> "$GITHUB_OUTPUT"

      - id: mingw
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          # shellcheck source=scripts/versions.env
          source scripts/versions.env
          TAG="llvm-mingw-${LLVM_VERSION}"
          PUBLISHED="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)"

          # needed <asset suffix>: is this archive still to be built?
          needed() {
            local asset="llvm-mingw-${LLVM_VERSION}-${LLVM_TRIPLET}-$1"
            if [ "$OVERWRITE" != "true" ] && grep -Fxq "$asset" <<<"$PUBLISHED"; then
              echo "Already published: $asset" >&2
              echo false
            else
              echo "To build: $asset" >&2
              echo true
            fi
          }

          LINUX='[]'
          LINUX_X86_64="$(needed ubuntu-22.04-x86_64.tar.xz)"
          if [ "$LINUX_X86_64" = true ]; then
            LINUX="$(jq -c '. + [{arch: "x86_64", runner: "ubuntu-22.04"}]' <<<"$LINUX")"
          fi
          if [ "$(needed ubuntu-22.04-aarch64.tar.xz)" = true ]; then
            LINUX="$(jq -c '. + [{arch: "aarch64", runner: "ubuntu-22.04-arm"}]' <<<"$LINUX")"
          fi

          {
            echo "tag=$TAG"
            echo "version=$LLVM_VERSION"
            echo "triplet=$LLVM_TRIPLET"
            echo "llvm_repository=https://github.com/${LLVM_REPO}.git"
            echo "llvm_commit=$LLVM_COMMIT"
            echo "llvm_targets=${LLVM_TARGETS//,/;}"
            echo "recipe_repo=$LLVM_MINGW_RECIPE_REPO"
            echo "recipe_commit=$LLVM_MINGW_RECIPE_COMMIT"
            echo "linux=$LINUX"
            echo "linux_x86_64=$LINUX_X86_64"
            echo "macos=$(needed macos-universal.tar.xz)"
            echo "windows=$(needed x86_64.zip)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Build toolchain (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build-llvm.sh --install-deps

      - name: Build toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          ./scripts/build-llvm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: llvm-toolchain-${{ matrix.platform }}
          path: dist/toolchain/llvm-*
          if-no-files-found: error
          compression-level: 0
          # A rerun replaces the archive of an earlier attempt.
          overwrite: true

  # The Windows archive is cross-compiled with the Linux LLVM-MinGW: the one
  # built by this run, or the published one if this run does not build it.
  build-windows:
    needs: [plan, mingw-linux]
    if: ${{ !cancelled() && needs.plan.outputs.windows == 'true' && (needs.plan.outputs.mingw_linux_x86_64 != 'true' || needs.mingw-linux.result != 'skipped') }}
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 350
    env:
      MINGW_NAME: llvm-mingw-${{ needs.plan.outputs.mingw_version }}-${{ needs.plan.outputs.mingw_triplet }}-ubuntu-22.04-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: LLVM-MinGW from this run
        if: needs.plan.outputs.mingw_linux_x86_64 == 'true'
        uses: actions/download-artifact@v4
        with:
          name: mingw-toolchain-ubuntu-22.04-x86_64
          path: cross

      - name: Build toolchain
        shell: bash
        run: |
          options=()
          if [ -f "cross/$MINGW_NAME.tar.xz" ]; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends xz-utils
            ( cd cross && sha256sum --check --strict "$MINGW_NAME.tar.xz.sha256" )
            tar -xJf "cross/$MINGW_NAME.tar.xz" -C cross
            rm "cross/$MINGW_NAME.tar.xz"
            options+=( "--mingw=$PWD/cross/$MINGW_NAME" )
          fi
          ./scripts/build-llvm.sh --install-deps --host=windows-x86_64 "${options[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: llvm-toolchain-windows-x86_64
          path: dist/toolchain/llvm-*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  # The cross-compiled Windows archive never ran on the machine that built
  # it: install it the way setup.ps1 does and run the smoke test for real.
  smoke-windows:
    needs: [plan, build-windows]
    # With no Windows archive to download, this job fails and the publish job
    # leaves Windows out.
    if: ${{ !cancelled() && needs.plan.outputs.windows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: llvm-toolchain-windows-x86_64
          path: dist/toolchain

      - name: Verify checksum and extract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sum = Get-Item dist/toolchain/llvm-*-windows-x86_64.zip.sha256
          $expected, $name = (Get-Content $sum.FullName -TotalCount 1) -split '\s+', 2
          $name = $name.TrimStart('*')
          if ($name -ne $sum.BaseName) { throw "Checksum file names '$name', expected '$($sum.BaseName)'" }
          $zip = Join-Path $sum.DirectoryName $name
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA256 mismatch for ${name}: $actual" }

          $dest = Join-Path $env:RUNNER_TEMP 'llvm'
          Expand-Archive -Path $zip -DestinationPath $dest
          $root = Join-Path $dest ($name -replace '\.zip$', '')
          & (Join-Path $root 'bin\clang.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "clang.exe exited with $LASTEXITCODE" }
          "TOOLCHAIN_DIR=$root" >> $env:GITHUB_ENV

      - name: Smoke test
        shell: bash
        run: |
          # Keep Git for Windows' MinGW runtime DLLs off PATH: the tools must
          # start with nothing but the system directory.
          PATH="/usr/bin:$(cygpath -u "$SYSTEMROOT")/System32" \
            ./scripts/smoke-llvm.sh "$(cygpath -u "$TOOLCHAIN_DIR")"

  publish:
    needs: [plan, build, build-windows, smoke-windows]
    # Publish the platforms that built even if another one failed.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'failure' || needs.build-windows.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
      WINDOWS_SMOKE: ${{ needs.smoke-windows.result }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: llvm-toolchain-*
          path: dist/toolchain
          merge-multiple: true

      - name: Upload to the toolchain release
        run: |
          shopt -s nullglob
          cd dist/toolchain

          # An archive from this or an earlier attempt of the run is only
          # good if the Windows smoke test of this attempt passed.
          if [[ "$WINDOWS_SMOKE" != "success" ]]; then
            for f in llvm-*-windows-*; do
              echo "::warning::Not publishing $f: Windows smoke test result is '$WINDOWS_SMOKE'."
              rm -f "$f"
            done
          fi

          sums=( llvm-*.sha256 )
          if [[ ${#sums[@]} -eq 0 ]]; then
            echo "No toolchain archives were built."
            exit 1
          fi
          sha256sum --check --strict "${sums[@]}"

          files=( llvm-* )

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --prerelease --latest=false \
              --title "LLVM ${TAG#llvm-}" \
              --notes "Host toolchain archives installed by rosbe-unix-bootstrap.sh as llvm."
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  # Cross compilers hosted on Linux. Built on Ubuntu 22.04 so the archives
  # only need glibc 2.35.
  mingw-linux:
    needs: plan
    if: needs.plan.outputs.mingw_linux != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.mingw_linux) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    env:
      LLVM_REPOSITORY: ${{ needs.plan.outputs.mingw_llvm_repository }}
      LLVM_VERSION: ${{ needs.plan.outputs.mingw_llvm_commit }}
      LLVM_TARGETS_TO_BUILD: ${{ needs.plan.outputs.mingw_llvm_targets }}
      # No dynamic dependency that would tie the binaries to one distro.
      LLVM_CMAKEFLAGS: -DLLVM_ENABLE_LIBXML2=OFF
      NAME: llvm-mingw-${{ needs.plan.outputs.mingw_version }}-${{ needs.plan.outputs.mingw_triplet }}-ubuntu-22.04-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.plan.outputs.mingw_recipe_repo }}
          ref: ${{ needs.plan.outputs.mingw_recipe_commit }}

      - name: Build
        run: |
          ./build-all.sh "$PWD/install/llvm-mingw" --disable-lldb --disable-clang-tools-extra

      - name: Test
        run: |
          ./run-tests.sh "$PWD/install/llvm-mingw"
          # The PowerPC backend has no MinGW runtime; check that it is there.
          echo 'int f(int a) { return a + 1; }' > ppc.c
          install/llvm-mingw/bin/clang --target=powerpcle-pc-windows-msvc -c ppc.c -o ppc.obj
          install/llvm-mingw/bin/llvm-readobj --file-headers ppc.obj | grep -i 'IMAGE_FILE_MACHINE_POWERPC'

      - name: Package
        run: |
          mkdir -p out
          mv install/llvm-mingw "install/$NAME"
          tar -Jcf "out/$NAME.tar.xz" --format=ustar --numeric-owner --owner=0 --group=0 --sort=name -C install "$NAME"
          ( cd out && sha256sum "$NAME.tar.xz" > "$NAME.tar.xz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: mingw-toolchain-ubuntu-22.04-${{ matrix.arch }}
          path: out/llvm-mingw-*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  # Universal (arm64 + x86_64) cross compiler hosted on macOS.
  mingw-macos:
    needs: plan
    if: needs.plan.outputs.mingw_macos == 'true'
    runs-on: macos-14
    timeout-minutes: 350
    env:
      LLVM_REPOSITORY: ${{ needs.plan.outputs.mingw_llvm_repository }}
      LLVM_VERSION: ${{ needs.plan.outputs.mingw_llvm_commit }}
      LLVM_TARGETS_TO_BUILD: ${{ needs.plan.outputs.mingw_llvm_targets }}
      # Homebrew's zstd only exists for the runner's own architecture.
      LLVM_CMAKEFLAGS: -DLLVM_ENABLE_ZSTD=OFF
      MACOS_REDIST: 1
      NAME: llvm-mingw-${{ needs.plan.outputs.mingw_version }}-${{ needs.plan.outputs.mingw_triplet }}-macos-universal
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.plan.outputs.mingw_recipe_repo }}
          ref: ${{ needs.plan.outputs.mingw_recipe_commit }}

      - name: Build
        run: |
          ./build-all.sh "$PWD/install/llvm-mingw" --disable-lldb --disable-clang-tools-extra

      - name: Test
        run: |
          ./run-tests.sh "$PWD/install/llvm-mingw"

      - name: Package
        run: |
          mkdir -p out
          mv install/llvm-mingw "install/$NAME"
          gtar -Jcf "out/$NAME.tar.xz" --format=ustar --numeric-owner --owner=0 --group=0 --sort=name -C install "$NAME"
          ( cd out && shasum -a 256 "$NAME.tar.xz" > "$NAME.tar.xz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: mingw-toolchain-macos-universal
          path: out/llvm-mingw-*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  # Toolchain hosted on Windows x86_64, cross-compiled with the Linux one,
  # whose runtimes it reuses.
  mingw-windows:
    needs: [plan, mingw-linux]
    if: ${{ !cancelled() && needs.plan.outputs.mingw_windows == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.mingw_tag }}
      LLVM_REPOSITORY: ${{ needs.plan.outputs.mingw_llvm_repository }}
      LLVM_VERSION: ${{ needs.plan.outputs.mingw_llvm_commit }}
      LLVM_TARGETS_TO_BUILD: ${{ needs.plan.outputs.mingw_llvm_targets }}
      LINUX_NAME: llvm-mingw-${{ needs.plan.outputs.mingw_version }}-${{ needs.plan.outputs.mingw_triplet }}-ubuntu-22.04-x86_64
      NAME: llvm-mingw-${{ needs.plan.outputs.mingw_version }}-${{ needs.plan.outputs.mingw_triplet }}-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.plan.outputs.mingw_recipe_repo }}
          ref: ${{ needs.plan.outputs.mingw_recipe_commit }}

      - name: Linux toolchain from this run
        if: needs.plan.outputs.mingw_linux_x86_64 == 'true'
        uses: actions/download-artifact@v4
        with:
          name: mingw-toolchain-ubuntu-22.04-x86_64
          path: native

      - name: Linux toolchain from the release
        if: needs.plan.outputs.mingw_linux_x86_64 != 'true'
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir native \
            --pattern "$LINUX_NAME.tar.xz" --pattern "$LINUX_NAME.tar.xz.sha256"

      - name: Unpack the Linux toolchain
        run: |
          ( cd native && sha256sum --check --strict "$LINUX_NAME.tar.xz.sha256" )
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -Jxf "native/$LINUX_NAME.tar.xz" -C /opt/llvm-mingw --strip-components=1
          rm -rf native

      - name: Build
        run: |
          ./build-cross-tools.sh /opt/llvm-mingw "$PWD/install/llvm-mingw" x86_64 \
            --disable-lldb --disable-clang-tools-extra

      - name: Package
        run: |
          mkdir -p out
          mv install/llvm-mingw "install/$NAME"
          ( cd install && zip -9rqX "../out/$NAME.zip" "$NAME" )
          ( cd out && sha256sum "$NAME.zip" > "$NAME.zip.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: mingw-toolchain-windows-x86_64
          path: out/llvm-mingw-*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  # The Windows toolchain never ran on the machine that built it: install it
  # the way setup.ps1 does and build something with it for real.
  mingw-smoke-windows:
    needs: [plan, mingw-windows]
    if: ${{ !cancelled() && needs.plan.outputs.mingw_windows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mingw-toolchain-windows-x86_64
          path: dist

      - name: Verify checksum and extract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sum = Get-Item dist/llvm-mingw-*-x86_64.zip.sha256
          $expected, $name = (Get-Content $sum.FullName -TotalCount 1) -split '\s+', 2
          $name = $name.TrimStart('*')
          if ($name -ne $sum.BaseName) { throw "Checksum file names '$name', expected '$($sum.BaseName)'" }
          $zip = Join-Path $sum.DirectoryName $name
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA256 mismatch for ${name}: $actual" }

          $dest = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Expand-Archive -Path $zip -DestinationPath $dest
          "TOOLCHAIN_DIR=$(Join-Path $dest ($name -replace '\.zip$', ''))" >> $env:GITHUB_ENV

      - name: Compile, link and run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:TOOLCHAIN_DIR 'bin'
          # Nothing but the toolchain and the system directory on PATH.
          $env:PATH = "$bin;$env:SystemRoot\System32"
          function Run($exe) {
            & $exe @args
            if ($LASTEXITCODE -ne 0) { throw "$exe exited with $LASTEXITCODE" }
          }

          Run clang --version
          Set-Content hello.cpp '#include <iostream>', 'int main() { std::cout << "hello" << std::endl; return 0; }'
          Run x86_64-w64-mingw32-clang++ hello.cpp -o hello.exe
          Run .\hello.exe
          foreach ($triple in 'i686-w64-mingw32', 'aarch64-w64-mingw32', 'armv7-w64-mingw32') {
            Run "$triple-clang++" hello.cpp -o "hello-$triple.exe"
          }
          Set-Content ppc.c 'int f(int a) { return a + 1; }'
          Run clang --target=powerpcle-pc-windows-msvc -c ppc.c -o ppc.obj

  mingw-publish:
    needs: [plan, mingw-linux, mingw-macos, mingw-windows, mingw-smoke-windows]
    # Publish the hosts that built even if another one failed.
    if: ${{ !cancelled() && (needs.mingw-linux.result == 'success' || needs.mingw-macos.result == 'success' || needs.mingw-windows.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.mingw_tag }}
      VERSION: ${{ needs.plan.outputs.mingw_version }}
      LLVM_COMMIT: ${{ needs.plan.outputs.mingw_llvm_commit }}
      LLVM_REPOSITORY: ${{ needs.plan.outputs.mingw_llvm_repository }}
      WINDOWS_SMOKE: ${{ needs.mingw-smoke-windows.result }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mingw-toolchain-*
          path: dist
          merge-multiple: true

      - name: Upload to the toolchain release
        run: |
          shopt -s nullglob
          cd dist

          # An archive from this or an earlier attempt of the run is only
          # good if the Windows smoke test of this attempt passed.
          if [[ "$WINDOWS_SMOKE" != "success" ]]; then
            for f in llvm-mingw-*.zip llvm-mingw-*.zip.sha256; do
              echo "::warning::Not publishing $f: Windows smoke test result is '$WINDOWS_SMOKE'."
              rm -f "$f"
            done
          fi

          sums=( llvm-mingw-*.sha256 )
          if [[ ${#sums[@]} -eq 0 ]]; then
            echo "No toolchain archives were built."
            exit 1
          fi
          sha256sum --check --strict "${sums[@]}"

          files=( llvm-mingw-* )

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --prerelease --latest=false \
              --title "LLVM-MinGW $VERSION" \
              --notes "LLVM-MinGW toolchain archives built from ${LLVM_REPOSITORY%.git} at $LLVM_COMMIT, installed by RosBE as llvm-mingw."
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
